<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bản đồ số tổ dân phố · Phường Đống Đa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" crossorigin="" />
  <link rel="stylesheet" href="css/map.css?v=16" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" /><circle cx="12" cy="9.5" r="2.5" /></svg>
      </span>
      <div class="brand-text">
        <h1>BẢN ĐỒ SỐ TỔ DÂN PHỐ</h1>
        <p>Phường Đống Đa, Hà Nội</p>
      </div>
    </div>

    <form class="filters" id="filters" onsubmit="return false">
      <div class="field field--ward">
        <label for="ward-select">Phường</label>
        <select id="ward-select"><option value="922" selected>Đống Đa</option></select>
      </div>
      <div class="field field--tdp">
        <label for="tdp-select">Tổ dân phố</label>
        <select id="tdp-select"><option value="">Chọn tổ dân phố</option></select>
      </div>
    </form>

    <div class="tools">
      <button type="button" class="tool-btn" id="layers-btn" aria-label="Chuyển sang vệ tinh" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z" /><path d="M3 13l9 5 9-5" /></svg>
        <span class="tool-label">Lớp dữ liệu</span>
      </button>
      <button type="button" class="tool-btn tool-btn--coord" id="coord-btn" aria-label="Lấy tọa độ" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="1.5" class="fill" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3" /></svg>
        <span class="tool-label">Lấy tọa độ</span>
      </button>
    </div>
  </header>

  <main class="stage">
    <div id="map" role="application" aria-label="Bản đồ tổ dân phố phường Đống Đa"></div>

    <details class="legend" id="legend" open>
      <summary>Chú thích</summary>
      <ul id="legend-list">
        <li><i class="sw sw--ward"></i>Phường</li>
        <li><i class="sw sw--tdp"></i>Mỗi tổ một màu</li>
      </ul>
    </details>

    <section class="info" id="info" aria-live="polite" hidden>
      <div class="info-hd">
        <h2 id="info-title"></h2>
        <button type="button" class="info-x" id="info-close" aria-label="Đóng thông tin tổ">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <div id="info-body"></div>
      <div class="info-actions">
        <a class="btn-primary" id="info-detail" href="#">Xem chi tiết</a>
        <button type="button" class="btn-ghost" id="info-share">Chia sẻ</button>
      </div>
    </section>

    <div class="map-ctrls">
      <button type="button" class="ctrl" id="locate-btn" aria-label="Vị trí của tôi">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 17-7-4-7 4z" /></svg>
      </button>
      <button type="button" class="ctrl" id="fs-btn" aria-label="Toàn màn hình">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
      </button>
      <div class="ctrl-group">
        <button type="button" class="ctrl" id="zoom-in" aria-label="Phóng to">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <button type="button" class="ctrl" id="zoom-out" aria-label="Thu nhỏ">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
        </button>
      </div>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js" crossorigin=""></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js" crossorigin=""></script>
  <script type="module" src="js/app.js?v=42"></script>
</body>
</html>
