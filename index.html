<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bản đồ xã, phường · Hà Nội</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="backdrop" id="backdrop"></div>

  <aside class="sidebar" id="sidebar" aria-label="Danh sách đơn vị">
    <div class="brand">
      <img src="assets/logo.svg" width="40" height="40" alt="" />
      <h1>Thành phố Hà Nội</h1>
    </div>
    <div class="stats">
      <div><span>Diện tích</span><strong id="city-area">—</strong></div>
      <div><span>Dân số</span><strong id="city-pop">—</strong></div>
      <div><span>Đơn vị</span><strong id="city-units">—</strong></div>
    </div>
    <p class="layer-note" id="layer-note"></p>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Tìm tổ dân phố…" autocomplete="off" enterkeyhint="search" />
    </div>
    <ul class="list" id="ward-list"></ul>
  </aside>

  <main class="map-pane">
    <button type="button" class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="sidebar">Danh sách</button>
    <div id="map" role="application" aria-label="Bản đồ Hà Nội"></div>
    <article class="detail" id="detail" aria-live="polite">
      <button type="button" class="close" id="detail-close" hidden aria-label="Đóng">×</button>
      <div id="detail-body"></div>
    </article>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="js/app.js?v=11"></script>
</body>
</html>
